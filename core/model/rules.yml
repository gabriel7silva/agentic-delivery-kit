# Every RULE-… id in core/, with its canon file, the capabilities it requires
# from a track, and whether an instance may switch it off.
#
# check_mapping.py crosses `requires` with each track's capabilities.yml and
# writes docs/compatibility-matrix.md. check_instance.py refuses to toggle a
# rule that is not `optional: true`. check_links.py verifies every `canon`
# path exists and contains the id.

version: 1

