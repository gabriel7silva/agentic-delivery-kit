  # ── optional rules — toggled per instance under `optional_rules:`
  - id: RULE-OPT-CLIENT-SIGNOFF
    canon: core/ceremonies/review.md
    requires: [attachments]
    optional: true
    instance_key: require_client_signoff
    note: Acceptance must be a signed artifact from an external approver
  - id: RULE-OPT-CHANGELOG
    canon: core/10-merge-rituals.md
    requires: []
    optional: true
    instance_key: require_changelog_entry
    note: Every Closed item of type STORY or BUG has a changelog line
  - id: RULE-OPT-ITERATION-REPORT
    canon: core/ceremonies/review.md
    requires: [queries]
    optional: true
    instance_key: require_iteration_report
    note: A written iteration report is produced at Review
  - id: RULE-HOMOLOG-QA
    canon: core/14-homologation.md
    requires: [comments]
    optional: true
    instance_key: require_homologation_qa
  - id: RULE-HOMOLOG-READY
    canon: core/14-homologation.md
    requires: [custom_fields, comments]
    optional: true
    instance_key: require_homologation_qa
  - id: RULE-KEY-USER-UPDATE
    canon: core/14-homologation.md
    requires: [comments]
    optional: true
    instance_key: require_homologation_qa
  - id: RULE-OPT-HOMOLOG-QA
    canon: core/14-homologation.md
    requires: [custom_fields, comments]
    optional: true
    instance_key: require_homologation_qa
    note: QA starts the homologation environment for the feature branch and links it; the key user tests there and updates the PO on the item before Closed
  - id: RULE-OPT-SPRINT-METRICS
    canon: core/ceremonies/planning.md
    requires: [custom_fields, iteration_native, queries]
    optional: true
    instance_key: track_sprint_metrics
    note: Effort, remaining work and business value live on the board fields; capacity per iteration is planned against them and the burndown is a view
  - id: RULE-OPT-EXTERNAL-REF
    canon: core/04-work-item-model.md
    requires: [custom_fields]
    optional: true
    instance_key: require_external_ref
    note: Every item that answers a request in another system carries that reference on the board field and in its title
