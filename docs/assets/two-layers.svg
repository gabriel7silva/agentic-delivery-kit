<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Two layers of guarantee. The runtime advises. The PR validator binds the context it is given, not the board. An agent setting Closed is refused.">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <marker id="ly-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="ly-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <filter id="ly-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="ly-ok" d="M160,70 L400,70 L640,70 L820,70"/>
    <path id="ly-no" d="M160,70 L400,160 L640,160"/>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="40" y="28" font-size="13" fill="#8b949e" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TWO LAYERS -- ON PURPOSE</text>
    <text x="920" y="28" text-anchor="end" font-size="13" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the runtime is not the lock</text>

    <g text-anchor="middle" font-size="13">
      <rect x="70" y="48" width="180" height="50" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 6">
        <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="160" y="70" fill="#8b949e" font-weight="700">runtime / CLI / bot</text>
      <text x="160" y="88" fill="#8b949e" font-size="11">layer 1 -- advises</text>

      <line x1="250" y1="73" x2="318" y2="73" stroke="#3fb950" stroke-width="2" marker-end="url(#ly-g)"/>

      <rect x="326" y="48" width="180" height="50" rx="10" fill="none" stroke="#3fb950" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="416" y="70" fill="#3fb950" font-weight="700">PR validator</text>
      <text x="416" y="88" fill="#8b949e" font-size="11">layer 2 -- binds context</text>

      <line x1="506" y1="73" x2="574" y2="73" stroke="#3fb950" stroke-width="2" marker-end="url(#ly-g)"/>

      <rect x="582" y="48" width="150" height="50" rx="10" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="657" y="70" fill="#3fb950" font-weight="700">Resolved</text>
      <text x="657" y="88" fill="#8b949e" font-size="11">agents may</text>

      <line x1="732" y1="73" x2="798" y2="73" stroke="#f0883e" stroke-width="2"/>

      <rect x="806" y="48" width="130" height="50" rx="10" fill="none" stroke="#f0883e" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="871" y="70" fill="#f0883e" font-weight="700">Closed</text>
      <text x="871" y="88" fill="#8b949e" font-size="11">human only</text>
    </g>

    <g text-anchor="middle">
      <path d="M160,98 L160,160 L416,160" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ly-r)">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <rect x="326" y="138" width="180" height="44" rx="10" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4 4">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="416" y="158" font-size="13" font-weight="700" fill="#f85149">Closed refused</text>
      <text x="416" y="174" font-size="11" fill="#f85149">an agent cannot set Closed</text>
    </g>

    <circle r="6" fill="#3fb950" filter="url(#ly-glow)">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#ly-ok"/></animateMotion>
      <animate attributeName="fill" values="#3fb950;#3fb950;#f0883e;#f0883e" keyTimes="0;0.55;0.75;1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <text x="480" y="214" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">copy adapters/_template to bind a CLI -- claims stay in the source of truth, not a lockfile</text>
    <text x="480" y="232" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the gate binds the context it is given -- it does not read the board</text>
  </g>
</svg>
