<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="N readers, one writer. Four reviewers read the same scope in parallel; one implementer holds the claim; a second writer is refused by the gate.">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <filter id="wg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="40" y="28" font-size="13" fill="#8b949e" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">N READERS · ONE WRITER</text>
    <text x="920" y="28" text-anchor="end" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the claim lives in the source of truth</text>

    <!-- the scope -->
    <g transform="translate(480,118)">
      <rect x="-78" y="-52" width="156" height="104" rx="10" fill="#3fb950">
        <animate attributeName="fill-opacity" values="0.04;0.12;0.04" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-78" y="-52" width="156" height="104" rx="10" fill="none" stroke="#8b949e" stroke-width="2"/>
      <g stroke="#8b949e" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
        <line x1="-48" y1="-26" x2="38" y2="-26" stroke-dasharray="86 86">
          <animate attributeName="stroke-dashoffset" values="86;0" dur="2.2s" repeatCount="indefinite"/>
        </line>
        <line x1="-48" y1="-8" x2="48" y2="-8" stroke-dasharray="96 96">
          <animate attributeName="stroke-dashoffset" values="96;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="-48" y1="10" x2="18" y2="10" stroke-dasharray="66 66">
          <animate attributeName="stroke-dashoffset" values="66;0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-48" y1="28" x2="42" y2="28" stroke-dasharray="90 90">
          <animate attributeName="stroke-dashoffset" values="90;0" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
        </line>
      </g>
      <text x="0" y="68" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scope · src/**</text>
    </g>

    <!-- readers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g transform="translate(168,62)">
        <text x="-32" y="5" text-anchor="end" font-size="11" fill="#8b949e">correctness</text>
        <circle r="18" fill="none" stroke="#8b949e" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-size="12" fill="#8b949e">C</text>
        <line x1="20" y1="6" x2="226" y2="48" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#r)">
          <animate attributeName="stroke-opacity" values=".25;1;.25" dur="2.4s" begin="0s" repeatCount="indefinite"/>
        </line>
      </g>
      <g transform="translate(168,108)">
        <text x="-32" y="5" text-anchor="end" font-size="11" fill="#8b949e">security</text>
        <circle r="18" fill="none" stroke="#8b949e" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-size="12" fill="#8b949e">S</text>
        <line x1="20" y1="2" x2="226" y2="10" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#r)">
          <animate attributeName="stroke-opacity" values=".25;1;.25" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
      <g transform="translate(168,154)">
        <text x="-32" y="5" text-anchor="end" font-size="11" fill="#8b949e">docs</text>
        <circle r="18" fill="none" stroke="#8b949e" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-size="12" fill="#8b949e">D</text>
        <line x1="20" y1="-2" x2="226" y2="-20" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#r)">
          <animate attributeName="stroke-opacity" values=".25;1;.25" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </line>
      </g>
      <g transform="translate(168,200)">
        <text x="-32" y="5" text-anchor="end" font-size="11" fill="#8b949e">process</text>
        <circle r="18" fill="none" stroke="#8b949e" stroke-width="2"/>
        <text y="5" text-anchor="middle" font-size="12" fill="#8b949e">P</text>
        <line x1="20" y1="-4" x2="226" y2="-64" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#r)">
          <animate attributeName="stroke-opacity" values=".25;1;.25" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
        </line>
      </g>
      <text x="40" y="236" font-size="12" fill="#8b949e">reviewers · parallel · read-only</text>
    </g>

    <!-- writer -->
    <g transform="translate(840,118)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <circle r="22" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#wg)">
        <animate attributeName="stroke-opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#3fb950">W</text>
      <line x1="-24" y1="0" x2="-274" y2="0" stroke="#3fb950" stroke-width="2.5" marker-end="url(#w)">
        <animate attributeName="stroke-dasharray" values="0 400;400 0" dur="2s" repeatCount="indefinite"/>
      </line>
      <g transform="translate(26,-26)">
        <rect x="-8" y="-2" width="16" height="12" rx="2" fill="#3fb950"/>
        <path d="M-4.5,-2 V-7 a4.5,4.5 0 0 1 9,0 V-2" fill="none" stroke="#3fb950" stroke-width="2"/>
      </g>
      <text x="0" y="48" text-anchor="middle" font-size="12" fill="#3fb950">implementer · holds the claim</text>
    </g>

    <!-- second writer refused -->
    <g transform="translate(840,214)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <circle r="13" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text y="4" text-anchor="middle" font-size="11" fill="#f85149">W</text>
      <path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f85149" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <text x="-22" y="4" text-anchor="end" font-size="11" fill="#f85149">second claim on the scope → refused by the gate</text>
    </g>
  </g>
</svg>
