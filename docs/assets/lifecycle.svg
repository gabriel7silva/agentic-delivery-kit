<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="Lifecycle: five categories New, Active, Resolved, Closed, Removed, holding twelve default states. A pulse runs New, In analysis, Awaiting development, In development, Awaiting test, Prepare homologation, Key-user homologation, Prepare release, Integration test, then stops. Only a human sets Closed. Rejection goes back to In development.">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <marker id="lc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="lc-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="lc-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <filter id="lc-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="lc-path" d="M165,103 L165,167 L292,167 L292,103 L384,103 L628,103 L628,231 L780,231 L780,103 L790,103"/>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="40" y="28" font-size="13" fill="#8b949e" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FIVE CATEGORIES - TWELVE STATES - ONE RULE</text>
    <text x="920" y="28" text-anchor="end" font-size="13" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Resolved is not Closed</text>

    <!-- category bands -->
    <g fill="none" stroke-width="1.5" stroke-dasharray="6 4">
      <rect x="40" y="64" width="240" height="192" rx="10" stroke="#6e7681"/>
      <rect x="304" y="64" width="160" height="192" rx="10" stroke="#6e7681"/>
      <rect x="488" y="64" width="280" height="192" rx="10" stroke="#3fb950"/>
      <rect x="792" y="64" width="128" height="192" rx="10" stroke="#f0883e"/>
    </g>
    <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="52" y="82" fill="#8b949e">NEW · Plan</text>
      <text x="316" y="82" fill="#8b949e">ACTIVE · Act</text>
      <text x="500" y="82" fill="#3fb950">RESOLVED · Check</text>
      <text x="760" y="82" text-anchor="end" fill="#3fb950">agents stop here</text>
      <text x="800" y="82" fill="#f0883e">CLOSED · Transfer</text>
    </g>

    <!-- NEW states -->
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">
      <rect x="55" y="92" width="210" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <text x="160" y="108">New</text>
      <line x1="160" y1="114" x2="160" y2="123" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="55" y="124" width="210" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <text x="160" y="140">In analysis</text>
      <line x1="160" y1="146" x2="160" y2="155" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="55" y="156" width="210" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <text x="160" y="172">Awaiting development</text>
    </g>

    <!-- ACTIVE states -->
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">
      <rect x="314" y="92" width="140" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <text x="384" y="108">In development</text>
      <line x1="378" y1="118" x2="378" y2="152" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <line x1="390" y1="152" x2="390" y2="118" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="314" y="156" width="140" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <text x="384" y="172">Blocked</text>
    </g>

    <!-- RESOLVED states -->
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#3fb950">
      <rect x="503" y="92" width="250" height="22" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="628" y="108">Awaiting test</text>
      <line x1="628" y1="114" x2="628" y2="123" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="503" y="124" width="250" height="22" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="628" y="140">Prepare homologation</text>
      <line x1="628" y1="146" x2="628" y2="155" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="503" y="156" width="250" height="22" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="628" y="172">Key-user homologation</text>
      <line x1="628" y1="178" x2="628" y2="187" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="503" y="188" width="250" height="22" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="628" y="204">Prepare release</text>
      <line x1="628" y1="210" x2="628" y2="219" stroke="#6e7681" stroke-width="1.5" marker-end="url(#lc-s)"/>
      <rect x="503" y="220" width="250" height="22" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="628" y="236">Integration test</text>
    </g>

    <!-- CLOSED -->
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#f0883e">
      <rect x="802" y="92" width="108" height="22" rx="11" fill="none" stroke="#f0883e" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="856" y="108">Closed</text>
    </g>
    <g transform="translate(856,150)">
      <circle cy="-12" r="5" fill="#f0883e"/>
      <path d="M-8,4 Q0,-6 8,4" fill="none" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"/>
      <text y="24" text-anchor="middle" font-size="11" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">human only</text>
    </g>

    <!-- category arrows -->
    <path d="M267,167 L292,167 L292,103 L310,103" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#lc-g)"/>
    <line x1="456" y1="103" x2="500" y2="103" stroke="#8b949e" stroke-width="2" marker-end="url(#lc-g)"/>
    <path d="M755,231 L780,231 L780,103 L800,103" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#lc-o)"/>

    <!-- rejection -->
    <path d="M628,256 L628,276 L384,276 L384,258" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#lc-o)"/>
    <text x="506" y="270" text-anchor="middle" font-size="10" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rejected: back with one objective note</text>

    <!-- pulse -->
    <circle r="6" fill="#3fb950" filter="url(#lc-glow)">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#lc-path"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <text x="40" y="302" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">New or Active ──► Removed   (a human; never counts as delivered)</text>
    <text x="480" y="326" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">categories are the contract · states are the board · the pulse never enters Closed on its own</text>
  </g>
</svg>
