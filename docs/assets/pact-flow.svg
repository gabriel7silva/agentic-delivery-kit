<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="PACT: a pulse travels Plan, Act, Check; a dashed loop returns from Check to Act until CI and reviews pass; then Transfer, always a human.">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M95,105 L335,105 L575,105 L575,196 L335,196 L335,105 L575,105 L835,105"/>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <text x="40" y="28" font-size="13" fill="#8b949e" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PACT · ONE ITEM'S LIFE</text>
    <text x="920" y="28" text-anchor="end" font-size="13" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Resolved ≠ Closed</text>

    <!-- Plan -->
    <g id="plan">
      <rect x="40" y="70" width="110" height="70" rx="10" fill="#3fb950" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0.16;0.16;0;0;0;0;0;0" keyTimes="0;0.12;0.18;0.55;0.70;0.72;0.78;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="70" width="110" height="70" rx="10" fill="none" stroke="#8b949e" stroke-width="2">
        <animate attributeName="stroke" values="#3fb950;#3fb950;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e" keyTimes="0;0.12;0.18;0.4;0.7;0.9;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="2.8;2.8;2;2;2;2;2" keyTimes="0;0.12;0.18;0.4;0.7;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="95" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#3fb950">Plan</text>
      <text x="95" y="118" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">New</text>
      <text x="95" y="154" text-anchor="middle" font-size="11" fill="#8b949e">PO · handoff</text>
    </g>

    <!-- Act -->
    <g id="act">
      <rect x="280" y="70" width="110" height="70" rx="10" fill="#3fb950" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0;0.16;0.16;0;0.16;0.16;0;0" keyTimes="0;0.12;0.26;0.32;0.42;0.55;0.62;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="280" y="70" width="110" height="70" rx="10" fill="none" stroke="#8b949e" stroke-width="2">
        <animate attributeName="stroke" values="#8b949e;#3fb950;#3fb950;#8b949e;#3fb950;#3fb950;#8b949e" keyTimes="0;0.12;0.26;0.32;0.42;0.55;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="335" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#3fb950">Act</text>
      <text x="335" y="118" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Active</text>
      <text x="335" y="154" text-anchor="middle" font-size="11" fill="#8b949e">one writer</text>
    </g>

    <!-- Check -->
    <g id="check">
      <rect x="520" y="70" width="110" height="70" rx="10" fill="#3fb950" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0;0;0.16;0.16;0;0;0.16;0" keyTimes="0;0.26;0.32;0.42;0.48;0.62;0.70;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="520" y="70" width="110" height="70" rx="10" fill="none" stroke="#8b949e" stroke-width="2">
        <animate attributeName="stroke" values="#8b949e;#8b949e;#3fb950;#3fb950;#8b949e;#8b949e;#3fb950;#8b949e" keyTimes="0;0.26;0.32;0.42;0.48;0.62;0.70;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="575" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#3fb950">Check</text>
      <text x="575" y="118" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Resolved</text>
      <text x="575" y="154" text-anchor="middle" font-size="11" fill="#8b949e">agents stop here</text>
    </g>

    <!-- Transfer -->
    <g id="transfer">
      <rect x="760" y="70" width="150" height="70" rx="10" fill="#f0883e" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0;0;0;0.18;0.18" keyTimes="0;0.70;0.74;0.82;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="760" y="70" width="150" height="70" rx="10" fill="none" stroke="#f0883e" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="0.45;0.45;0.45;1;1" keyTimes="0;0.70;0.74;0.82;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="835" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#f0883e">Transfer</text>
      <text x="835" y="118" text-anchor="middle" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Closed · human only</text>
      <text x="835" y="154" text-anchor="middle" font-size="11" fill="#f0883e">Approver</text>
    </g>

    <!-- forward arrows -->
    <line x1="150" y1="105" x2="272" y2="105" stroke="#8b949e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="390" y1="105" x2="512" y2="105" stroke="#8b949e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="630" y1="105" x2="752" y2="105" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ao)" opacity=".55">
      <animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.70;0.82;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <text x="211" y="92" text-anchor="middle" font-size="11" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">handoff</text>
    <text x="451" y="92" text-anchor="middle" font-size="11" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">push</text>
    <text x="691" y="92" text-anchor="middle" font-size="11" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">receipt</text>

    <!-- loop back -->
    <path d="M575,140 L575,196 L335,196 L335,142" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)">
      <animate attributeName="stroke-dashoffset" from="52" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <text x="455" y="218" text-anchor="middle" font-size="12" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fixes until CI and reviews pass</text>
    <text x="455" y="236" text-anchor="middle" font-size="11" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">then a human accepts the value</text>

    <!-- traveling pulse -->
    <circle r="7" fill="#3fb950" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="0">
        <mpath href="#track"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;1;1;0" keyTimes="0;0.04;0.35;0.55;0.78;0.94;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#3fb950;#3fb950;#3fb950;#f0883e;#f0883e" keyTimes="0;0.55;0.70;0.82;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- human at Transfer -->
    <g transform="translate(905,52)">
      <circle cx="0" cy="0" r="5" fill="#f0883e">
        <animate attributeName="r" values="5;6.5;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M-8,16 Q0,6 8,16" fill="none" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
