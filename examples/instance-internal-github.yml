# Example instance — internal team, GitHub Projects as source of truth, Slack mirror.
version: 1
language: en
topology: agent-to-human

organization:
  name: Acme Corp
  product: Acme Portal
  profile: internal

source_of_truth:
  track: github-projects
  board: Product Delivery

mirrors:
  - track: slack
    purpose: notifications
    channel: product-delivery-updates

roles:
  product_owner: { kind: human, title: Product Owner }
  orchestrator: { kind: agent, title: Delivery Orchestrator }
  implementer: { kind: agent, title: Implementer }
  reviewers: { kind: agent, roster: agents/roster.yml }
  approver: { kind: human, title: Product Owner }
  qa: { kind: human, title: QA }
  key_user: { kind: human, title: Key user }

cadence:
  timezone: UTC
  iteration_length_days: 7
  iteration_start_day: monday
  sprint_close: friday
  iteration_name_pattern: "Sprint {seq:02} {yy} Q{quarter} {product}"
  sequence_resets: year
  planning: start of iteration, on the start day
  sync: daily
  refinement: at sprint close
  review: at sprint close
  retrospective: at sprint close

conventions:
  branch_pattern: "{type}/{item-id}-{slug}"
  verification_commands: [make lint, make test]
  agent_context_file: AGENT-CONTEXT.md
  current_focus_file: CURRENT-FOCUS.md

risk:
  policy_file: agents/policies/risk-floors.yml
  levels: [low, medium, high]

optional_rules:
  require_client_signoff: false
  require_changelog_entry: true
  require_iteration_report: false
  require_homologation_qa: false

# The model ships twelve states (core/model/item-states.yml). This team runs nine: no
# homologation stage, no integration test. Every category keeps at least one state, and
# Closed and Removed stay human-only — that is what check_instance verifies. `labels` is
# optional: what the board shows for a state, in the instance language.
lifecycle:
  states: [NEW, IN_ANALYSIS, AWAITING_DEVELOPMENT, BLOCKED, IN_DEVELOPMENT, AWAITING_TEST, PREPARE_RELEASE, CLOSED, REMOVED]
  labels:
    AWAITING_TEST: Awaiting PO test
