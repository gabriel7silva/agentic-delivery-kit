name: delivery-guard

# PACT gate for pull requests. Copy to .github/workflows/ in a repository that
# vendors the kit at .pact/ (see .pact/automation/ci/INSTALL.md). Make it a
# required status check.
#
# Inputs it derives itself: changed paths (git), PR body (event payload).
# Inputs it prefers: board-snapshot.json from an SoT query, merged by
# build_context.py onto the pact-context block. Without a snapshot, a pass
# is a check of the author's declaration, not of the board.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: scope · claims · review · risk · evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r .pact/automation/requirements.txt

      - name: Changed paths
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-paths.txt
          echo "::group::changed paths"; cat changed-paths.txt; echo "::endgroup::"

      - name: PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.md

      # Prefer a board snapshot (list of Item dicts) written by an earlier SoT
      # query. build_context.py overlays it on the pact-context block; without a
      # snapshot the declared PR context is the fallback (source=declared).

      - name: Build context
        run: |
          ARGS=(--pr-body pr-body.md --out context.json)
          if [ -f board-snapshot.json ]; then
            ARGS+=(--snapshot board-snapshot.json)
          fi
          python .pact/automation/scripts/build_context.py "${ARGS[@]}" || true

      - name: Validate
        run: |
          if [ -f context.json ]; then
            python .pact/automation/scripts/validate_pr.py \
              --changed-paths changed-paths.txt --context context.json --pr-body pr-body.md
          else
            python .pact/automation/scripts/validate_pr.py \
              --changed-paths changed-paths.txt --pr-body pr-body.md
          fi
