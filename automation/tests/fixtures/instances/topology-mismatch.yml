# Fixture — must be REJECTED: agent-to-agent with a human orchestrator.
version: 1
language: en
topology: agent-to-agent
organization: { name: Acme Corp, profile: internal }
source_of_truth: { track: github-projects, board: Delivery }
roles:
  product_owner: { kind: agent, title: Backlog agent }
  orchestrator: { kind: human, title: Delivery lead }
  implementer: { kind: agent, title: Implementer }
  reviewers: { kind: agent, roster: agents/roster.yml }
  approver: { kind: human, title: Sponsor }
cadence:
  timezone: UTC
  iteration_length_days: 14
  planning: start of iteration
  sync: daily
  refinement: weekly
  review: end of iteration
  retrospective: end of iteration
conventions:
  branch_pattern: "{type}/{item-id}-{slug}"
  verification_commands: [make test]
  agent_context_file: AGENT-CONTEXT.md
  current_focus_file: CURRENT-FOCUS.md
risk: { policy_file: agents/policies/risk-floors.yml, levels: [low, medium, high] }
